<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Öğretmen Etüt Takip Sistemi (2026–2027)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --mat-bg: #fdecea;
            --fen-bg: #eafaf1;
            --tur-bg: #f4ecf7;
        }
        html, body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa; font-size: 14px;
        }
        header {
            background-color: #2c3e50; color: white;
            padding: 12px 15px;
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 10px;
        }
        header h1 { margin: 0; font-size: 16px; white-space: nowrap; }
        .user-panel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .user-panel select, .user-panel input {
            padding: 8px 10px; font-size: 13px; border-radius: 5px;
            border: 1px solid #ccc; min-height: 38px;
        }
        button {
            padding: 8px 14px; border: none; background-color: #34495e; color: white;
            cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 13px;
            min-height: 38px; touch-action: manipulation;
        }
        button:hover { background-color: #465866; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-secondary { background-color: #7f8c8d; }
        .btn-excel { background-color: #1d6f42; }
        .btn-excel:hover { background-color: #165a35; }
        .btn-red { background-color: #ff4d4d; }
        .btn-blue { background-color: #3498db; }
        .logged-info { color: #2ecc71; font-weight: bold; font-size: 13px; }
        .branch-info { color: #f39c12; font-weight: bold; font-size: 13px; }

        .step-info {
            background: #fff3cd; border-bottom: 1px solid #ffeeba; color: #856404;
            padding: 10px 15px; font-weight: bold; font-size: 13px; text-align: center;
        }
        .step-info.done { background: #d4edda; border-color: #c3e6cb; color: #155724; }

        .color-bar {
            display: none; align-items: center; gap: 10px; padding: 10px 15px;
            background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap;
        }
        .color-bar .label { font-weight: bold; color: #2c3e50; font-size: 13px; }
        .color-btn {
            padding: 8px 16px; border: 3px solid transparent; border-radius: 5px;
            cursor: pointer; font-weight: bold; color: white; font-size: 13px;
        }
        .color-btn.active { border-color: #2c3e50; box-shadow: 0 0 8px rgba(0,0,0,0.3); }
        .color-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .student-bar {
            display: none; align-items: center; gap: 10px; padding: 10px 15px;
            background: #ecf0f1; flex-wrap: wrap;
        }
        .student-bar .label { font-weight: bold; color: #2c3e50; font-size: 13px; }
        .student-bar select {
            padding: 8px 10px; font-size: 13px; border-radius: 5px; border: 1px solid #aaa;
            min-width: 180px; flex: 1; max-width: 320px; min-height: 38px;
        }
        .student-bar select:disabled { background: #ddd; cursor: not-allowed; }

        .controls {
            display: none; justify-content: space-between; align-items: center;
            padding: 12px 15px; background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 8px; flex-wrap: wrap; gap: 10px;
        }

        .legend {
            display: flex; gap: 8px; padding: 8px 15px; flex-wrap: wrap;
            font-size: 12px; background: #fff;
        }
        .badge {
            padding: 4px 9px; border-radius: 4px; color: white;
            font-size: 11px; font-weight: bold;
        }
        .badge-red { background-color: #ff4d4d; }
        .badge-blue { background-color: #3498db; }
        .badge-info { background-color: #7f8c8d; }
        .badge-past { background-color: #c0392b; }
        .badge-next { background-color: #f39c12; }
        .badge-loading { background-color: #f39c12; }

        .table-wrapper {
            padding: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        table {
            border-collapse: collapse; background-color: #fff;
            table-layout: auto; min-width: 100%;
        }
        th, td {
            border: 1px solid #bdc3c7; text-align: center; padding: 2px; overflow: hidden;
        }

        thead tr:first-child th.week-header {
            background-color: #2c3e50;
            font-size: 13px;
            color: white;
            white-space: nowrap;
            width: 1%;
            padding: 8px 12px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        thead tr:first-child th {
            color: white; font-size: 14px; font-weight: bold;
            padding: 10px 4px; letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        thead tr:first-child th[data-lesson="matematik"] {
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            border-left: 4px solid #2c3e50; border-right: 4px solid #2c3e50;
        }
        thead tr:first-child th[data-lesson="fen"] {
            background: linear-gradient(180deg, #27ae60, #1e8449);
            border-right: 4px solid #2c3e50;
        }
        thead tr:first-child th[data-lesson="türkçe"] {
            background: linear-gradient(180deg, #8e44ad, #6c3483);
        }

        #slotHeaderRow th {
            background-color: #465866; color: white; font-size: 11px;
            padding: 5px 1px; font-weight: normal;
            width: 40px; min-width: 40px;
        }
        #slotHeaderRow th[data-lesson="matematik"] { background-color: #d98880; }
        #slotHeaderRow th[data-lesson="matematik"]:first-child { border-left: 4px solid #2c3e50; }
        #slotHeaderRow th[data-lesson="fen"] { background-color: #7dcea0; }
        #slotHeaderRow th[data-lesson="türkçe"] { background-color: #bb8fce; }

        #slotHeaderRow th.slot-end, tbody td.slot.slot-end { border-right: 4px solid #2c3e50 !important; }
        #slotHeaderRow th.slot-start, tbody td.slot.slot-start { border-left: 4px solid #2c3e50 !important; }

        tbody td {
            height: 36px; font-size: 10px; font-weight: bold;
            white-space: normal; line-height: 1.1; word-break: break-word; padding: 2px 1px;
        }
        tbody td:first-child {
            font-weight: bold; font-size: 11px;
            background: #ecf0f1; color: #2c3e50;
            line-height: 1.3;
            white-space: nowrap;
            width: 1%;
            padding: 4px 10px;
        }

        tbody td.slot[data-lesson="matematik"] { background-color: var(--mat-bg); }
        tbody td.slot[data-lesson="fen"]      { background-color: var(--fen-bg); }
        tbody td.slot[data-lesson="türkçe"]   { background-color: var(--tur-bg); }

        td.slot { cursor: pointer; transition: all 0.15s; }
        td.slot:hover { filter: brightness(0.93); }
        td.slot.type-kirmizi { background-color: #ff4d4d !important; color: white !important; }
        td.slot.type-mavi    { background-color: #3498db !important; color: white !important; }

        td.slot.selected {
            outline: 3px solid #f39c12; outline-offset: -3px;
            transform: scale(1.08); z-index: 10; position: relative;
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.8);
        }

        td.slot.branch-locked {
            background-color: #e5e5e5 !important; cursor: not-allowed !important; opacity: 0.55;
        }

        /* ===== KİLİTLİ HAFTA (geçmiş + mevcut) ===== */
        td.slot.past-week {
            background-color: #f5f5f5 !important;
            color: #bdc3c7 !important;
            cursor: not-allowed !important;
            opacity: 0.75;
            position: relative;
        }
        td.slot.past-week::after {
            content: "🔒";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            opacity: 0.7;
        }
        td.slot.past-week:hover { filter: none; }
        td.slot.past-week.type-kirmizi,
        td.slot.past-week.type-mavi { opacity: 1; }
        td.slot.past-week.type-kirmizi::after,
        td.slot.past-week.type-mavi::after { content: ""; }

        /* Mevcut hafta satırı — koyu gri (kilitli) */
        tbody tr.current-week-row td:first-child {
            background: #7f8c8d !important;
            color: white;
            font-size: 11px;
        }

        /* ===== ÖNÜMÜZDEKİ HAFTA — TURUNCU VURGU ===== */
        tbody tr.next-week-row td:first-child {
            background: #f39c12 !important;
            color: white;
            font-size: 11px;
        }
        td.slot.next-week-cell {
            box-shadow: inset 0 0 0 3px #f39c12;
        }

        td.slot.admin-editable { cursor: cell !important; }

        @media (max-width: 768px) {
            header { padding: 10px; flex-direction: column; align-items: stretch; }
            header h1 { font-size: 15px; text-align: center; }
            .user-panel { justify-content: center; width: 100%; }
            .user-panel select, .user-panel input { flex: 1; min-width: 0; }
            .step-info { font-size: 12px; padding: 8px 10px; }
            .color-bar, .student-bar { padding: 8px 10px; }
            .color-bar .label, .student-bar .label { font-size: 12px; width: 100%; }
            .controls { flex-direction: column; align-items: stretch; }
            .controls > div { display: flex; flex-wrap: wrap; gap: 6px; }
            .controls button, .controls select { flex: 1; min-width: 100px; }
            .table-wrapper { padding: 4px; }
            thead tr:first-child th { font-size: 12px; padding: 7px 2px; }
            thead tr:first-child th.week-header { font-size: 10px; padding: 6px 6px; }
            tbody td { height: 32px; font-size: 9px; }
            tbody td:first-child { font-size: 9px; padding: 3px 6px; }
            #slotHeaderRow th { width: 34px; min-width: 34px; font-size: 10px; }
        }

        .scroll-hint {
            display: none; text-align: center; font-size: 11px; color: #7f8c8d;
            padding: 4px; background: #f8f9fa; border-bottom: 1px solid #e9ecef;
        }
        @media (max-width: 1100px) { .scroll-hint { display: block; } }
    </style>
</head>
<body>

    <header>
        <h1>📚 Etüt Takip Sistemi <span id="yearLabel" style="font-size:13px; color:#f39c12;"></span></h1>
        <div class="user-panel">
            <div id="loginZone" style="display:flex; gap:8px; flex-wrap:wrap;">
                <select id="teacherSelect">
                    <option value="">-- Hoca Seçin --</option>
                </select>
                <input type="password" id="teacherPass" placeholder="Şifre" />
                <button onclick="loginTeacher()">Giriş Yap</button>
            </div>
            <div id="loggedZone" style="display:none; align-items:center; gap:8px; flex-wrap:wrap;">
                <span class="logged-info">👤 <span id="loggedTeacherName"></span></span>
                <span class="branch-info">📚 <span id="loggedTeacherBranch"></span></span>
                <button onclick="logoutTeacher()" style="background:#e74c3c;">Çıkış</button>
            </div>
            <div class="admin-zone">
                <button id="adminBtn" onclick="toggleAdminMode()">Admin</button>
                <span id="adminStatus" style="display:none; color:#2ecc71; font-weight:bold;">⚡</span>
            </div>
        </div>
    </header>

    <main>
        <div class="step-info" id="stepInfo">
            <span class="badge badge-loading">⏳ Supabase'den veri yükleniyor...</span>
        </div>

        <div class="color-bar" id="colorBar">
            <span class="label">1️⃣ Renk:</span>
            <button class="color-btn btn-red" data-color="Kırmızı" onclick="selectColor('Kırmızı')" disabled>🔴 Kırmızı</button>
            <button class="color-btn btn-blue" data-color="Mavi" onclick="selectColor('Mavi')" disabled>🔵 Mavi</button>
            <span id="selectedColorInfo" style="margin-left:10px; color:#555; font-size:12px;"></span>
        </div>

        <div class="student-bar" id="studentBar">
            <span class="label">2️⃣ Öğrenci:</span>
            <select id="studentSelect" disabled>
                <option value="">-- Öğrenci Seçin --</option>
            </select>
            <span class="badge badge-info" id="studentStatusBadge">Seçili: yok</span>
        </div>

        <section class="controls" id="adminControls">
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button onclick="downloadYearExcel()" class="btn-excel">📊 Yıllık Excel İndir</button>
                <button onclick="exportData()" class="btn-secondary">Yedekle (.json)</button>
                <input type="file" id="importFile" onchange="importData()" style="display:none;">
                <button onclick="document.getElementById('importFile').click()" class="btn-secondary">Yedekten Yükle</button>
                <button onclick="openStudentManager()" class="btn-secondary">Öğrenci Listesi</button>
            </div>
        </section>

        <div class="legend">
            <span class="badge badge-red">Kırmızı Etüt</span>
            <span class="badge badge-blue">Mavi Etüt</span>
            <span class="badge badge-past">🔒 Geçmiş + bu hafta kilitli</span>
            <span class="badge badge-next">📌 Önümüzdeki hafta (kayıt yapılabilir)</span>
            <span class="badge badge-info">Sadece gelecek haftalara kayıt</span>
        </div>

        <div class="scroll-hint" id="scrollHint">👉 Tabloyu yatay kaydırabilirsiniz</div>

        <div class="table-wrapper">
            <table id="etutTable">
                <thead>
                    <tr id="lessonHeaderRow">
                        <th rowspan="2" class="week-header">Hafta</th>
                        <th colspan="10" data-lesson="matematik">📐 MATEMATİK</th>
                        <th colspan="10" data-lesson="fen">🔬 FEN</th>
                        <th colspan="10" data-lesson="türkçe">📖 TÜRKÇE</th>
                    </tr>
                    <tr id="slotHeaderRow"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        /* ============================================================
           1) AYARLAR
           ============================================================ */
        const SUPABASE_URL = "https://zveunzdzdhjoxharnpgs.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2ZXVuemR6ZGhqb3hoYXJucGdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDY2NzYsImV4cCI6MjEwNjcyMjY3Nn0.vk4x_3pOVTdNRavfeCWINWc-gsfTG0xKnrf6IPrc_l4";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let ADMIN_PASSWORD = "admin123";
        let TEACHERS = {};

        const BRANCH_LABELS = {
            "matematik": "Matematik",
            "fen": "Fen",
            "türkçe": "Türkçe"
        };

        const DEFAULT_STUDENTS = [
            "Ali Yılmaz", "Ayşe Demir", "Mehmet Kaya", "Zeynep Şahin",
            "Can Öztürk", "Elif Aydın", "Burak Çelik", "Merve Arslan",
            "Emre Koç", "Selin Yıldız", "Kerem Doğan", "Deniz Kurt",
            "Ece Aslan", "Baran Taş", "İrem Polat", "Arda Erdoğan"
        ];

        const ACADEMIC_YEAR = {
            label: "2026–2027",
            start: new Date(2026, 7, 31),   // 31 Ağustos 2026 Pazartesi
            end:   new Date(2027, 5, 25)    // 25 Haziran 2027 Cuma
        };

        /* ============================================================
           2) DURUM
           ============================================================ */
        let isAdmin = false;
        let loggedTeacher = null;
        let loggedBranch  = null;
        let selectedColor = null;
        let selectedSlot  = null;

        const lessons = ["matematik", "fen", "türkçe"];
        const slotsPerLesson = 10;

        let currentData = {};
        let students = [...DEFAULT_STUDENTS];
        let weeks = [];

        /* ============================================================
           3) YARDIMCI FONKSİYONLAR
           ============================================================ */
        function pad2(n) { return String(n).padStart(2, '0'); }

        function dateToTR(d) {
            return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
        }

        function getToday() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function getMonday(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            const diff = (day === 0 ? -6 : 1 - day);
            d.setDate(d.getDate() + diff);
            return d;
        }

        function addDays(date, n) {
            const d = new Date(date);
            d.setDate(d.getDate() + n);
            return d;
        }

        function getCurrentWeekMonday() {
            return getMonday(getToday());
        }

        function setStatus(html, cls) {
            const el = document.getElementById("stepInfo");
            el.innerHTML = html;
            el.className = "step-info" + (cls ? " " + cls : "");
        }

        /* ⭐ KİLİT KURALI: geçmiş + bu hafta kilitli */
        function isLockedWeek(monday) {
            const currentMonday = getCurrentWeekMonday();
            const m = new Date(monday);
            m.setHours(0, 0, 0, 0);
            return m.getTime() <= currentMonday.getTime();
        }

        function isCurrentWeek(monday) {
            const currentMonday = getCurrentWeekMonday();
            const m = new Date(monday);
            m.setHours(0, 0, 0, 0);
            return m.getTime() === currentMonday.getTime();
        }

        /* ⭐ ÖNÜMÜZDEKİ HAFTA: bu haftanın Pazartesi'si + 7 gün */
        function isNextWeek(monday) {
            const currentMonday = getCurrentWeekMonday();
            const nextMonday = addDays(currentMonday, 7);
            const m = new Date(monday);
            m.setHours(0, 0, 0, 0);
            return m.getTime() === nextMonday.getTime();
        }

        /* ============================================================
           4) EĞİTİM YILI HAFTALARINI OLUŞTUR
           ============================================================ */
        function buildAcademicWeeks() {
            const list = [];
            let monday = new Date(ACADEMIC_YEAR.start);
            monday.setHours(0, 0, 0, 0);
            const lastMondayDate = getMonday(ACADEMIC_YEAR.end);

            let weekNo = 1;
            while (monday <= lastMondayDate) {
                const friday = addDays(monday, 4);
                list.push({
                    no: weekNo,
                    monday: new Date(monday),
                    friday: new Date(friday),
                    mondayStr: dateToTR(monday),
                    fridayStr: dateToTR(friday)
                });
                weekNo++;
                monday = addDays(monday, 7);
            }
            return list;
        }

        function setActiveYear() {
            document.getElementById("yearLabel").innerText = `— ${ACADEMIC_YEAR.label} Eğitim Yılı`;
            weeks = buildAcademicWeeks();
            buildSlotHeader();
            renderTable();
            updateStepInfo();
        }

        /* ============================================================
           5) SUPABASE — YÜKLE
           ============================================================ */
        async function loadFromSupabase() {
            try {
                const { data: etutData, error: etutErr } = await supabaseClient
                    .from('etutler').select('*');
                if (etutErr) throw etutErr;

                currentData = {};
                (etutData || []).forEach(row => {
                    currentData[row.slot_id] = {
                        student: row.ogrenci,
                        teacher: row.hoca,
                        branch: row.brans,
                        type: row.renk
                    };
                });

                const { data: ogrData, error: ogrErr } = await supabaseClient
                    .from('ogrenciler').select('isim');
                if (ogrErr) throw ogrErr;

                if (ogrData && ogrData.length > 0) {
                    students = ogrData.map(r => r.isim);
                } else {
                    students = [...DEFAULT_STUDENTS];
                }

                const { data: hocalarData, error: hocalarErr } = await supabaseClient
                    .from('hocalar').select('*');
                if (hocalarErr) throw hocalarErr;

                TEACHERS = {};
                (hocalarData || []).forEach(h => {
                    TEACHERS[h.isim] = { password: h.sifre, branch: h.brans };
                });

                const { data: adminAyar, error: adminErr } = await supabaseClient
                    .from('ayarlar').select('deger')
                    .eq('anahtar', 'admin_sifre').maybeSingle();

                if (!adminErr && adminAyar) {
                    ADMIN_PASSWORD = adminAyar.deger;
                }

            } catch (err) {
                console.error("Supabase yükleme hatası:", err);
                setStatus(`❌ Supabase bağlantı hatası: ${err.message || err}`, "");
                throw err;
            }
        }

        /* ============================================================
           6) SUPABASE — KAYDET
           ============================================================ */
        async function saveCurrent() {
            try {
                const { error: delErr } = await supabaseClient
                    .from('etutler')
                    .delete()
                    .neq('id', '00000000-0000-0000-0000-000000000000');
                if (delErr) throw delErr;

                const rows = Object.entries(currentData).map(([slotId, d]) => ({
                    slot_id: slotId,
                    ogrenci: d.student,
                    hoca: d.teacher,
                    brans: d.branch,
                    renk: d.type,
                    ay: ACADEMIC_YEAR.label
                }));

                if (rows.length > 0) {
                    const { error: insErr } = await supabaseClient
                        .from('etutler').insert(rows);
                    if (insErr) throw insErr;
                }
            } catch (err) {
                console.error("Kaydetme hatası:", err);
                alert("❌ Kaydetme hatası: " + (err.message || err));
            }
        }

        /* ============================================================
           7) BAŞLATMA
           ============================================================ */
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                await loadFromSupabase();
                setActiveYear();
                fillTeacherSelect();
                fillStudentSelect();
                updateStepInfo();
            } catch (err) {
                console.error("Başlatma hatası:", err);
            }
        });

        function buildSlotHeader() {
            const row = document.getElementById("slotHeaderRow");
            row.innerHTML = "";
            for (const lesson of lessons) {
                for (let i = 1; i <= slotsPerLesson; i++) {
                    const th = document.createElement("th");
                    th.dataset.lesson = lesson;
                    th.innerText = i;
                    if (i === 1) th.classList.add("slot-start");
                    if (i === slotsPerLesson) th.classList.add("slot-end");
                    row.appendChild(th);
                }
            }
        }

        function fillTeacherSelect() {
            const sel = document.getElementById("teacherSelect");
            const prev = sel.value;
            sel.innerHTML = '<option value="">-- Hoca Seçin --</option>';
            Object.keys(TEACHERS).forEach(name => {
                const opt = document.createElement("option");
                opt.value = name;
                opt.innerText = `${name} (${BRANCH_LABELS[TEACHERS[name].branch]})`;
                sel.appendChild(opt);
            });
            if (prev && TEACHERS[prev]) sel.value = prev;
        }

        function fillStudentSelect() {
            const sel = document.getElementById("studentSelect");
            const prev = sel.value;
            sel.innerHTML = '<option value="">-- Öğrenci Seçin --</option>';
            students.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s;
                opt.innerText = s;
                sel.appendChild(opt);
            });
            if (prev) sel.value = prev;
            updateStudentStatusBadge();
        }

        /* ============================================================
           8) HOCA GİRİŞ / ÇIKIŞ
           ============================================================ */
        function loginTeacher() {
            const name = document.getElementById("teacherSelect").value;
            const pass = document.getElementById("teacherPass").value;

            if (!name) { alert("Lütfen hoca seçin!"); return; }
            if (!pass) { alert("Lütfen şifre girin!"); return; }

            const t = TEACHERS[name];
            if (t && t.password === pass) {
                loggedTeacher = name;
                loggedBranch  = t.branch;

                document.getElementById("loginZone").style.display = "none";
                document.getElementById("loggedZone").style.display = "flex";
                document.getElementById("loggedTeacherName").innerText = name;
                document.getElementById("loggedTeacherBranch").innerText = BRANCH_LABELS[t.branch];
                document.getElementById("colorBar").style.display = "flex";
                document.getElementById("studentBar").style.display = "flex";
                document.getElementById("teacherPass").value = "";

                clearSlotSelection();
                applyBranchHighlight();
                renderTable();
                updateStepInfo();
            } else {
                alert("Hatalı şifre!");
            }
        }

        function logoutTeacher() {
            loggedTeacher = null;
            loggedBranch = null;
            clearSlotSelection();

            document.getElementById("loginZone").style.display = "flex";
            document.getElementById("loggedZone").style.display = "none";
            document.getElementById("colorBar").style.display = "none";
            document.getElementById("studentBar").style.display = "none";
            document.getElementById("teacherSelect").value = "";

            applyBranchHighlight();
            renderTable();
            updateStepInfo();
        }

        function applyBranchHighlight() {
            document.querySelectorAll("#lessonHeaderRow th[data-lesson]").forEach(th => {
                th.style.opacity = (loggedBranch && th.dataset.lesson !== loggedBranch) ? "0.5" : "1";
            });
        }

        /* ============================================================
           9) ADIM BİLGİSİ
           ============================================================ */
        function updateStepInfo() {
            if (isAdmin) {
                setStatus("⚡ Admin Modu — Silmek için hücreye tıklayın. Geçmiş ve bu hafta kilitli.");
                return;
            }
            if (!loggedTeacher) {
                setStatus("🔒 Lütfen giriş yapın.");
                return;
            }
            if (!selectedSlot) {
                setStatus(`📌 <b>${BRANCH_LABELS[loggedBranch]}</b> branşından <b>turuncu çerçeveli önümüzdeki haftaya</b> tıklayın.`);
                return;
            }
            if (!selectedColor) {
                setStatus(`🎨 Seçili hücre: <b>${selectedSlot.id}</b> — Şimdi renk seçin.`);
                return;
            }
            setStatus(`👤 Seçili hücre: <b>${selectedSlot.id}</b> (${selectedColor}) — Şimdi öğrenci seçin.`, "done");
        }

        /* ============================================================
           10) RENK
           ============================================================ */
        function selectColor(color) {
            if (!selectedSlot) { alert("Önce bir hücre seçin!"); return; }
            selectedColor = color;
            document.getElementById("selectedColorInfo").innerText = `Renk: ${color}`;
            updateColorButtons();
            document.getElementById("studentSelect").disabled = false;
            updateStepInfo();
        }

        function updateColorButtons() {
            document.querySelectorAll(".color-btn").forEach(b => {
                b.classList.toggle("active", b.dataset.color === selectedColor);
                b.disabled = !selectedSlot;
            });
        }

        /* ============================================================
           11) TABLO ÇİZİMİ
           ============================================================ */
        function renderTable() {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            weeks.forEach(w => {
                const tr = document.createElement("tr");
                const locked = isLockedWeek(w.monday);
                const current = isCurrentWeek(w.monday);
                const next = isNextWeek(w.monday);

                if (current) tr.classList.add("current-week-row");
                if (next) tr.classList.add("next-week-row");

                const tdWeek = document.createElement("td");
                tdWeek.innerHTML = `<b>${w.no}. Hafta</b><br><span style="font-size:9px; font-weight:normal;">${w.mondayStr.slice(0,5)} – ${w.fridayStr.slice(0,5)}</span>`;
                tr.appendChild(tdWeek);

                lessons.forEach(lesson => {
                    for (let i = 1; i <= slotsPerLesson; i++) {
                        const slotId = `${w.mondayStr}-${lesson}-${i}`;
                        const tdSlot = document.createElement("td");
                        tdSlot.className = "slot";
                        tdSlot.dataset.id = slotId;
                        tdSlot.dataset.lesson = lesson;
                        if (i === 1) tdSlot.classList.add("slot-start");
                        if (i === slotsPerLesson) tdSlot.classList.add("slot-end");

                        if (currentData[slotId]) {
                            const d = currentData[slotId];
                            tdSlot.innerText = d.student;
                            tdSlot.title = `${d.student} — ${BRANCH_LABELS[lesson]} — ${d.type} (${d.teacher})`;
                            tdSlot.classList.add(d.type === "Kırmızı" ? "type-kirmizi" : "type-mavi");
                        } else {
                            tdSlot.innerText = "";
                        }

                        if (selectedSlot && selectedSlot.id === slotId) {
                            tdSlot.classList.add("selected");
                        }

                        // Kilit
                        if (locked && !isAdmin) {
                            tdSlot.classList.add("past-week");
                        }

                        // Önümüzdeki hafta turuncu çerçeve
                        if (next) {
                            tdSlot.classList.add("next-week-cell");
                        }

                        if (!isAdmin && loggedBranch && lesson !== loggedBranch) {
                            if (!currentData[slotId]) tdSlot.classList.add("branch-locked");
                        }

                        if (isAdmin) {
                            tdSlot.classList.add("admin-editable");
                        }

                        tdSlot.addEventListener("click", () => handleSlotClick(slotId, lesson, w));
                        tr.appendChild(tdSlot);
                    }
                });
                tbody.appendChild(tr);
            });
        }

        /* ============================================================
           12) SLOT TIKLAMA
           ============================================================ */
        function handleSlotClick(slotId, lesson, week) {
            if (isAdmin) {
                if (currentData[slotId]) {
                    if (confirm("Bu etütü silmek istediğinize emin misiniz?")) {
                        delete currentData[slotId];
                        saveCurrent();
                        renderTable();
                    }
                } else {
                    alert("Admin modunda boş slota atama yapılamaz.");
                }
                return;
            }

            if (!loggedTeacher) { alert("Lütfen önce hoca girişi yapın!"); return; }

            if (isLockedWeek(week.monday)) {
                if (isCurrentWeek(week.monday)) {
                    alert("❌ Bu hafta kilitli! Lütfen önümüzdeki haftaya kayıt yapın.");
                } else {
                    alert("❌ Geçmiş haftalara etüt ataması yapılamaz!");
                }
                return;
            }

            if (lesson !== loggedBranch) {
                alert(`Siz sadece ${BRANCH_LABELS[loggedBranch]} branşına etüt ekleyebilirsiniz!`);
                return;
            }
            if (currentData[slotId]) { alert("Bu slot zaten dolu!"); return; }

            if (selectedSlot && selectedSlot.id === slotId) {
                clearSlotSelection();
                renderTable();
                updateStepInfo();
                return;
            }

            selectedSlot = { id: slotId, lesson: lesson, week: week };
            selectedColor = null;
            document.getElementById("selectedColorInfo").innerText = "";
            document.getElementById("studentSelect").value = "";
            document.getElementById("studentSelect").disabled = true;
            updateStudentStatusBadge();
            updateColorButtons();

            renderTable();
            updateStepInfo();
        }

        function clearSlotSelection() {
            selectedSlot = null;
            selectedColor = null;
            document.getElementById("selectedColorInfo").innerText = "";
            document.getElementById("studentSelect").value = "";
            document.getElementById("studentSelect").disabled = true;
            updateStudentStatusBadge();
            updateColorButtons();
        }

        /* ============================================================
           13) ÖĞRENCİ SEÇİMİ → ATAMA
           ============================================================ */
        document.getElementById("studentSelect").addEventListener("change", async function() {
            const student = this.value;
            updateStudentStatusBadge();

            if (!student) return;
            if (!selectedSlot) { alert("Önce bir hücre seçin!"); return; }
            if (!selectedColor) { alert("Önce renk seçin!"); return; }
            if (currentData[selectedSlot.id]) { alert("Bu slot zaten dolu!"); return; }

            const mondayStr = selectedSlot.week.mondayStr;
            const already = Object.entries(currentData).find(
                ([id, val]) => val && val.student === student && id.startsWith(mondayStr + "-")
            );
            if (already) {
                alert(`"${student}" bu hafta zaten başka bir slota atanmış!\nSlot: ${already[0]}`);
                this.value = "";
                updateStudentStatusBadge();
                return;
            }

            currentData[selectedSlot.id] = {
                student: student,
                teacher: loggedTeacher,
                branch: loggedBranch,
                type: selectedColor
            };

            await saveCurrent();

            clearSlotSelection();
            renderTable();
            updateStepInfo();
        });

        function updateStudentStatusBadge() {
            const val = document.getElementById("studentSelect").value;
            document.getElementById("studentStatusBadge").innerText = val ? `Seçili: ${val}` : "Seçili: yok";
        }

        /* ============================================================
           14) ADMIN
           ============================================================ */
        function toggleAdminMode() {
            if (!isAdmin) {
                const pass = prompt("Admin şifresini girin:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById("adminStatus").style.display = "inline";
                    document.getElementById("adminControls").style.display = "flex";
                    document.getElementById("adminBtn").innerText = "Admin Çıkışı";
                    renderTable();
                    updateStepInfo();
                } else {
                    alert("Hatalı şifre!");
                }
            } else {
                isAdmin = false;
                document.getElementById("adminStatus").style.display = "none";
                document.getElementById("adminControls").style.display = "none";
                document.getElementById("adminBtn").innerText = "Admin";
                renderTable();
                updateStepInfo();
            }
        }

        /* ============================================================
           15) ÖĞRENCİ LİSTESİ
           ============================================================ */
        async function openStudentManager() {
            const current = students.join("\n");
            const input = prompt("Öğrenci listesini düzenleyin (her satıra bir isim):", current);
            if (input === null) return;

            const arr = input.split("\n").map(s => s.trim()).filter(s => s.length > 0);
            if (arr.length === 0) { alert("En az bir öğrenci olmalı!"); return; }

            try {
                const { error: delErr } = await supabaseClient
                    .from('ogrenciler').delete()
                    .neq('id', '00000000-0000-0000-0000-000000000000');
                if (delErr) throw delErr;

                const rows = arr.map(isim => ({ isim }));
                const { error: insErr } = await supabaseClient
                    .from('ogrenciler').insert(rows);
                if (insErr) throw insErr;

                students = arr;
                fillStudentSelect();
                alert(`✅ ${students.length} öğrenci kaydedildi.`);
            } catch (err) {
                alert("❌ Kaydetme hatası: " + (err.message || err));
            }
        }

        /* ============================================================
           16) EXCEL
           ============================================================ */
        function downloadYearExcel() {
            const wb = XLSX.utils.book_new();
            const ws = buildYearWorksheet(currentData);
            XLSX.utils.book_append_sheet(wb, ws, "Etütler");
            const fname = `etut_${ACADEMIC_YEAR.label.replace("–","-")}_${new Date().toISOString().slice(0,10)}.xlsx`;
            XLSX.writeFile(wb, fname);
            alert(`✅ ${ACADEMIC_YEAR.label} yılı Excel dosyası indirildi.`);
        }

        function buildYearWorksheet(dataObj) {
            const header = ["Öğrenci Adı", "Toplam"];
            weeks.forEach(w => {
                lessons.forEach(lesson => {
                    header.push(`${w.no}.Hf ${BRANCH_LABELS[lesson].slice(0,3)}`);
                });
            });

            const rows = [];
            rows.push([`Eğitim Yılı: ${ACADEMIC_YEAR.label}`]);
            rows.push([]);
            rows.push(header);

            const map = {};
            students.forEach(s => { map[s] = {}; });

            Object.entries(dataObj).forEach(([slotId, d]) => {
                if (!d || !d.student) return;
                const parts = slotId.split("-");
                const dateStr = parts[0];
                const lesson = parts[1];
                const slotNo = parseInt(parts[2]);
                const dateObj = parseDateTR(dateStr);
                const monday = getMonday(dateObj);
                const mondayStr = dateToTR(monday);

                const week = weeks.find(w => w.mondayStr === mondayStr);
                if (!week) return;

                if (!map[d.student]) map[d.student] = {};
                if (!map[d.student][week.no]) map[d.student][week.no] = {};
                map[d.student][week.no][lesson] = slotNo;
            });

            const allStudents = [...students];
            Object.keys(map).forEach(s => {
                if (!allStudents.includes(s)) allStudents.push(s);
            });

            allStudents.forEach(student => {
                const row = [student, 0];
                let total = 0;

                weeks.forEach(w => {
                    lessons.forEach(lesson => {
                        const wk = map[student] && map[student][w.no];
                        const slotNo = wk && wk[lesson];
                        if (slotNo) {
                            row.push(`${slotNo}. slot`);
                            total++;
                        } else {
                            row.push("");
                        }
                    });
                });
                row[1] = total;
                rows.push(row);
            });

            const ws = XLSX.utils.aoa_to_sheet(rows);
            const colWidths = [{ wch: 22 }, { wch: 8 }];
            weeks.forEach(() => lessons.forEach(() => colWidths.push({ wch: 10 })));
            ws['!cols'] = colWidths;

            const totalCols = 2 + weeks.length * lessons.length;
            ws['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: totalCols - 1 } }
            ];

            return ws;
        }

        function parseDateTR(str) {
            const parts = str.split(".");
            return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
        }

        /* ============================================================
           17) YEDEKLEME
           ============================================================ */
        function exportData() {
            const fullBackup = {
                current: currentData,
                students: students,
                academicYear: ACADEMIC_YEAR.label,
                exportedAt: new Date().toISOString()
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullBackup, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", `etut_yedek_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function importData() {
            const file = document.getElementById("importFile").files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.current) {
                        alert("Geçersiz yedek dosyası.");
                        return;
                    }

                    if (!confirm("Mevcut Supabase verileri SİLİNECEK ve yedekteki veriler yüklenecek. Onaylıyor musunuz?")) return;

                    await supabaseClient.from('etutler').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                    const etutRows = Object.entries(imported.current).map(([slotId, d]) => ({
                        slot_id: slotId,
                        ogrenci: d.student,
                        hoca: d.teacher,
                        brans: d.branch,
                        renk: d.type,
                        ay: ACADEMIC_YEAR.label
                    }));
                    if (etutRows.length > 0) {
                        const { error } = await supabaseClient.from('etutler').insert(etutRows);
                        if (error) throw error;
                    }

                    if (imported.students && imported.students.length > 0) {
                        await supabaseClient.from('ogrenciler').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                        const ogrRows = imported.students.map(isim => ({ isim }));
                        const { error } = await supabaseClient.from('ogrenciler').insert(ogrRows);
                        if (error) throw error;
                    }

                    currentData = imported.current;
                    if (imported.students) students = imported.students;

                    renderTable();
                    fillStudentSelect();
                    alert("✅ Yedek başarıyla Supabase'e yüklendi!");
                } catch (err) {
                    alert("❌ Yedek yükleme hatası: " + (err.message || err));
                }
            };
            reader.readAsText(file);
        }

        /* ============================================================
           Periyodik yenileme
           ============================================================ */
        setInterval(async () => {
            if (isAdmin || loggedTeacher) return;
            try {
                const { data, error } = await supabaseClient.from('etutler').select('*');
                if (error) return;
                const fresh = {};
                (data || []).forEach(row => {
                    fresh[row.slot_id] = {
                        student: row.ogrenci,
                        teacher: row.hoca,
                        branch: row.brans,
                        type: row.renk
                    };
                });
                if (JSON.stringify(fresh) !== JSON.stringify(currentData)) {
                    currentData = fresh;
                    renderTable();
                }
            } catch (err) {}
        }, 30000);

        /* Debug */
        window.addEventListener("load", () => {
            setTimeout(() => {
                const cm = getCurrentWeekMonday();
                const nm = addDays(cm, 7);
                console.log("🔍 DEBUG:");
                console.log("  Bugün:", getToday().toLocaleDateString('tr-TR'));
                console.log("  Bu haftanın Pazartesi'si:", cm.toLocaleDateString('tr-TR'));
                console.log("  Önümüzdeki haftanın Pazartesi'si:", nm.toLocaleDateString('tr-TR'));
            }, 1500);
        });
    </script>
